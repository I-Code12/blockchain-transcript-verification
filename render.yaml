services:
  - type: web
    name: nexusverify-api
    runtime: node
    rootDir: .
    buildCommand: cd backend && npm ci
    startCommand: cd backend && npm start
    healthCheckPath: /health
    disk:
      name: nexusverify-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /var/data/nexusverify.db
      - key: BLOCKCHAIN_DEPLOYMENT
        value: sepolia
      - key: BLOCKCHAIN_NETWORK_NAME
        value: Ethereum Sepolia
      - key: BLOCK_EXPLORER_URL
        value: https://sepolia.etherscan.io
      - key: BLOCKCHAIN_RPC_URL
        sync: false
      - key: REGISTRAR_PRIVATE_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: FRONTEND_URLS
        sync: false
      - key: SEED_DEMO_DATA
        value: "false"
