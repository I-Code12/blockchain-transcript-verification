services:
  - type: web
    name: nexusverify-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: cd backend && npm ci
    startCommand: cd backend && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: nexusverify-db
          property: connectionString
      - key: BLOCKCHAIN_DEPLOYMENT
        value: sepolia
      - key: BLOCKCHAIN_NETWORK_NAME
        value: Ethereum Sepolia
      - key: BLOCK_EXPLORER_URL
        value: https://sepolia.etherscan.io
      - key: BLOCKCHAIN_RPC_URL
        sync: false
      - key: REGISTRAR_PRIVATE_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: TRANSCRIPT_ENCRYPTION_KEY
        sync: false
      - key: PUBLIC_APP_URL
        value: https://nexusverify-frontend.onrender.com
      - key: FRONTEND_URL
        value: https://nexusverify-frontend.onrender.com
      - key: FRONTEND_URLS
        value: https://nexusverify-frontend.onrender.com
      - key: SEED_DEMO_DATA
        value: "false"

  - type: web
    name: nexusverify-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: VITE_API_URL
        value: https://nexusverify-api.onrender.com
      - key: VITE_PUBLIC_MODE
        value: "true"

databases:
  - name: nexusverify-db
    plan: free
    databaseName: nexusverify
    user: nexusverify
